<!DOCTYPE html>
<html lang="en">
<head>
    <title>Rock paper scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body
 style="background-image:url(https://th.bing.com/th/id/OIP.giIEHvae0QCbmI7nFfV8BQHaEo?w=326&h=180&c=7&r=0&o=7&pid=1.7&rm=3);
background-size: cover;">

    <p class="title">Rock Paper Scissors</p>

    <div class="layout">
        <div class="side">
            <img src="rock-paper-scissors-background.webp" alt="game">
            <p class="tagline">
                A simple game of luck.<br>
                Choose wisely.
            </p>
        </div>


        <div class="rock-paper-scissors">
            <div class="rock">
                <button class="rock-button">
                <img src="Rock.png"> 
                </button>
            </div>

            <div class="paper">
                <button class="paper-button">
                <img src="Paper.png"> 
                </button>
            </div>

            <div class="scissors">
                <button class="scissors-button">
                <img src="Scissors.png"> 
                </button>
            </div>

        </div>

        <div class="score-box">

            <h3 class="score-title">SCORE</h3>

            <p class="scoreEl">Wins: 0, Losses: 0, Ties: 0</p>

            <button class= "reset-button">
                Reset Score
            </button>
            <span class="message"></span>

            <button class="auto-play-button">Start Auto-Play</button>

        </div>        
    </div>
    
    <script src="rock-paper-scissors.js">'java script document'</script>

</body>
</html>
